name: Terraform Lint

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths: [ "terraform/catalog/modules/**" ]

permissions:
  contents: write

jobs:
  code-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-git

      - run: |
          git fetch origin ${{ github.head_ref }}
          git pull origin ${{ github.head_ref }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: latest

      - name: Format Terraform code
        run: terraform fmt -recursive
        working-directory: terraform/catalog/modules

      - name: Commit changes
        run: |
          git add -A
          git commit -m "chore: auto-format Terraform files [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform/catalog/modules
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        # Report warnings without failing the PR; only errors block.
        run: tflint --recursive --format compact --minimum-failure-severity=error
        working-directory: terraform/catalog/modules
